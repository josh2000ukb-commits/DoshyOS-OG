source /boot/grub/config.cfg

# doshy OS boot menu (UEFI). Placeholders are filled in by live-build.
# "noautologin" shows the login screen (multi-user); the Advanced entry skips it.
menuentry "Start doshy OS" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ noautologin
	initrd	@INITRD_LIVE@
}

menuentry "Start doshy OS (safe graphics mode)" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ noautologin nomodeset
	initrd	@INITRD_LIVE@
}

submenu 'Advanced options...' --hotkey=a {

	source /boot/grub/theme.cfg

	menuentry "Start doshy OS with automatic login (no login screen)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@
		initrd	@INITRD_LIVE@
	}

	menuentry "Start doshy OS without saving changes (no persistence)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ noautologin nopersistence
		initrd	@INITRD_LIVE@
	}

	menuentry "Start doshy OS (fail-safe mode)" {
		linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
		initrd	@INITRD_LIVE@
	}

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
