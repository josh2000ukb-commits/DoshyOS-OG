[Seat:*]
# Always start the doshy OS (Openbox) desktop.
# The login screen lists every user (Settings -> Users). Automatic login is
# off on the live USB; tick "Log in automatically" in the installer if you
# want it on a full install.
user-session=openbox
greeter-session=lightdm-gtk-greeter
greeter-hide-users=false
greeter-show-manual-login=true
allow-user-switching=true
allow-guest=false
autologin-user=
